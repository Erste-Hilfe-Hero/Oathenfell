name: Migration Access Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  check:
    if: >
      github.event.issue.user.login == 'Erste-Hilfe-Hero' &&
      startsWith(github.event.issue.title, '[migration-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required access without printing credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CONTABO_CLIENT_ID: ${{ secrets.CONTABO_CLIENT_ID }}
          CONTABO_CLIENT_SECRET: ${{ secrets.CONTABO_CLIENT_SECRET }}
          CONTABO_API_USER: ${{ secrets.CONTABO_API_USER }}
          CONTABO_API_PASSWORD: ${{ secrets.CONTABO_API_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const hasRailway = Boolean(process.env.RAILWAY_TOKEN);
          console.log(`RAILWAY_TOKEN_PRESENT=${hasRailway}`);
          const names = ['CONTABO_CLIENT_ID','CONTABO_CLIENT_SECRET','CONTABO_API_USER','CONTABO_API_PASSWORD'];
          const allContabo = names.every((name) => Boolean(process.env[name]));
          console.log(`CONTABO_SECRETS_PRESENT=${allContabo}`);
          if (!allContabo) process.exit(0);
          const requestId = crypto.randomUUID();
          const form = new URLSearchParams({
            client_id: process.env.CONTABO_CLIENT_ID,
            client_secret: process.env.CONTABO_CLIENT_SECRET,
            username: process.env.CONTABO_API_USER,
            password: process.env.CONTABO_API_PASSWORD,
            grant_type: 'password',
          });
          const auth = await fetch('https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: form,
          });
          if (!auth.ok) {
            console.log(`CONTABO_API_AUTH=failed_${auth.status}`);
            process.exit(0);
          }
          const { access_token: token } = await auth.json();
          const response = await fetch('https://api.contabo.com/v1/compute/instances/100207587', {
            headers: { authorization: `Bearer ${token}`, 'x-request-id': requestId },
          });
          if (!response.ok) {
            console.log(`CONTABO_INSTANCE_READ=failed_${response.status}`);
            process.exit(0);
          }
          const raw = await response.json();
          const instance = raw.data?.[0] ?? raw;
          console.log(`CONTABO_INSTANCE_READ=ok`);
          console.log(`CONTABO_INSTANCE_STATUS=${String(instance.status ?? 'unknown')}`);
          console.log(`CONTABO_INSTANCE_REGION=${String(instance.region ?? 'unknown')}`);
          console.log(`CONTABO_SSH_KEYS_ATTACHED=${Array.isArray(instance.sshKeys) ? instance.sshKeys.length : 0}`);
          NODE
